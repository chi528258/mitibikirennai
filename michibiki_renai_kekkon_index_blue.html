<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>michibiki｜恋愛タイプ＆結婚タイプ</title>
<style>
:root{--pink:#ffffff;--rose:#4f91bd;--cream:#ffffff;--ink:#356b91;--mint:#dff1ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff2ff 0%,#eaf7ff 42%,#f7fbff 72%,#fffaf4 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px;background:transparent}.panel,.report{background:var(--cream);border:1px solid #efdadd;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #8d59600d}
h1{text-align:center;color:var(--rose);font-size:25px;margin:8px 0}h2{font-size:18px;color:var(--rose);border-bottom:1px solid #efdadd;padding-bottom:9px}
small,.muted{color:#5d8fb2}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{width:100%;border:1px solid #e5c9cd;border-radius:12px;padding:12px;background:white;color:var(--ink);font:inherit}
textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:999px;padding:12px 18px;background:var(--rose);color:white;font-weight:700;font-size:14px}button.secondary{background:#e9d9d7;color:#6e5558}
.hero{text-align:center}.hero img{width:180px;max-width:55%;border-radius:20px;background:var(--mint)}.number{font-size:42px;color:var(--rose);font-weight:800}
.result{white-space:pre-wrap;line-height:1.9}.spot{display:inline-block;background:#f8e6e7;border-radius:12px;padding:9px 13px;margin:4px}
.hide{display:none}.report{display:none}.report.show{display:block}.tag{font-size:12px;background:#f8e6e7;padding:5px 10px;border-radius:99px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel,.report{padding:16px}}
@media print{body{background:white}.wrap{max-width:none;padding:0}.panel,.btns{display:none!important}.report{display:block!important;box-shadow:none;border:0;page-break-inside:avoid}.report.show{display:block}}
</style></head><body><main class="wrap">
<h1>michibiki</h1><p class="hero muted">恋愛タイプ ＆ 結婚タイプ鑑定書</p>
<section class="panel">
<h2>鑑定情報を入力</h2>
<div class="grid">
<label class="field">お名前<input id="name" placeholder="お名前"></label>
<label class="field">生年月日<input id="birth" type="date"></label>
</div>
<label class="field">運命数<select id="num"></select></label>
<label class="field">第一命星<select id="star"></select></label>
<label class="field">運命の人と出会う時期（手入力）<input id="timing" placeholder="例：2027年頃／30歳〜32歳"></label>
<div class="btns"><button onclick="makeReport()">鑑定書を作成</button><button class="secondary" onclick="window.print()">PDFで保存・印刷</button></div>
<small>※運命数と第一命星は鑑定者が選択できます。出会う時期も手入力です。</small>
</section>
<section class="panel">
<h2>鑑定文章の編集</h2>
<p class="muted">恋愛性格は登録済みの文章を表示します。好きなこと・好きなものはここで入力できます。33の恋愛性格も文章が届いたら追加できます。</p>
<label class="field">好きなこと<textarea id="likes" placeholder="運命数ごとの好きなことを入力"></textarea></label>
<label class="field">好きなもの<textarea id="things" placeholder="運命数ごとの好きなものを入力"></textarea></label>
<label class="field">結婚後の補足（任意）<textarea id="marriageExtra" placeholder="必要に応じて入力"></textarea></label>
</section>
<section class="report" id="report">
<div class="hero"><img id="reportImg" alt="レッサーパンダ"><p class="tag">あなたの鑑定結果</p><h1 id="reportName"></h1><div class="number" id="reportNum"></div></div>
<h2>恋愛タイプ</h2><div class="result" id="love"></div>
<h2>好きなこと・好きなもの</h2><div class="result" id="likesOut"></div>
<h2>ラッキースポット・ラッキーカラー</h2><div id="lucky"></div>
<h2>結婚したらどんな人？</h2><div class="result" id="marriage"></div>
<h2>運命の人と出会う時期</h2><div class="result" id="timingOut"></div>
<p class="muted" style="text-align:center;margin-top:28px">michibiki 〜自分らしい幸せへの道しるべ〜</p>
</section></main>
