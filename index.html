.report{display:none;position:relative;overflow:hidden;width:100%;max-width:1000px;margin-left:auto;margin-right:auto;background:radial-gradient(ellipse at top left,#fff0ee 0,#fffaf4 36%,#fff9f2 100%);border:2px solid #e8b5c2;border-radius:34px;padding:24px 26px 30px;box-shadow:0 8px 30px #9e657018}.report.show{display:block}.report:before,.report:after{content:"✿  ❀  ✿";position:absolute;color:#e9a2b3;opacity:.6;font-size:30px;letter-spacing:8px;pointer-events:none}.report:before{top:12px;left:16px}.report:after{bottom:12px;right:16px}.hero{text-align:center;padding:14px 8px 24px}.brandmark{font-family:cursive;font-style:italic;color:#9f174c;font-size:27px;line-height:1.1}.brandmark small{display:block;font-family:serif;font-style:normal;font-size:12px;letter-spacing:.45em;margin-top:3px}.hero h2{font-size:clamp(36px,7vw,54px);letter-spacing:.2em;color:var(--rose);margin:10px 0 0}.hero .tagline{font-size:17px;margin:0 0 14px}.hero .tag{display:block;margin:14px auto 8px;max-width:420px;background:#f9dfe6;color:#68434e;border-radius:99px;padding:9px 18px;font-size:17px}.reportName{font-size:27px;color:#a82458;margin:8px}.number{font-size:48px;color:var(--rose);font-weight:700;letter-spacing:.08em;margin:2px}.flower{color:var(--gold);text-align:center;letter-spacing:.45em;font-size:18px;margin:14px}.hero-art{display:none}.section{position:relative;border:1.5px solid #e9a5b8;border-radius:27px;padding:20px 24px 22px;margin:16px 0;background:#fffdfb}.sectionTitle{font-size:clamp(20px,4vw,29px);font-weight:700;color:var(--rose);margin:0 0 16px;display:flex;align-items:center;gap:12px}.sectionTitle .badgeNum{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;background:#ef7897;color:#fff;font-size:30px}.result{white-space:pre-wrap;line-height:2.05;font-size:17px;color:#4f4246}.section.lucky{border-color:#8dc1e5;background:#fafdff}.lucky .sectionTitle{color:var(--blue)}.lucky .badgeNum{background:#73b6e4}.section.marriage{border-color:# .hero-layout{display:grid;grid-template-columns:42% 58%;align-items:center;gap:18px;max-width:900px;margin:12px auto 0}.hero-art-wrap{background:#e9f5f3;border-radius:28px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:220px}.hero-art{display:block;width:100%;height:240px;object-fit:contain}.hero-info{text-align:center}.hero-info .tag{max-width:100%;font-size:20px}@media(max-width:560px){.hero-layout{grid-template-columns:1fr 1.2fr;gap:8px}.hero-art-wrap{min-height:130px;border-radius:18px}.hero-art{height:145px}.hero-info .tag{font-size:13px;padding:8px 10px}.reportName{font-size:22px}.number{font-size:38px}}

</style></head><body><main class="wrap">
<div class="brand">～michibiki～</div><div class="sub">みちびき</div><h1>人生鑑定</h1><div class="tagline">〜 あなたの恋愛・結婚の傾向 〜</div>
<section class="panel"><h2>鑑定情報を入力</h2><div class="grid">
<label class="field">お名前<input id="name" placeholder="お名前"></label>
<label class="field">生年月日<input id="birth" type="date"></label></div>
<label class="field">運命数<input id="numDisplay" value="生年月日から自動計算" readonly></label>
<label class="field">結婚したらどんな性格？（第一命星）<select id="star"><option value="">第一命星を選択</option></select></label>
<div class="btns"><button onclick="makeReport()">鑑定書を作成</button><button class="secondary" onclick="savePNG()">画像（PNG）で保存</button></div>
<p class="hint">運命数は生年月日から自動計算します。結婚後の性格は、第一命星を選択してください。画像保存にはインターネット接続が必要です。</p></section>
<section class="report" id="report">
<div class="hero"><div class="brandmark">〜michibiki〜<small>みちびき</small></div><h2>人生鑑定</h2><div class="tagline">〜 あなたの恋愛・結婚の傾向 〜</div><div class="hero-layout"><div class="hero-art-wrap"><img class="hero-art" id="mascot" alt="運命数のレッサーパンダ"></div><div class="hero-info"><div class="tag">あなたの鑑定結果</div><div class="reportName" id="reportName"></div><div class="number" id="reportNum"></div></div></div><div class="flower">◇ ✧ ❖ ✧ ◇</div></div>
<div class="section"><div class="sectionTitle"><span class="badgeNum">1</span>恋愛したらどんなタイプ？</div><div class="result" id="love"></div></div>
<div class="section lucky"><div class="sectionTitle"><span class="badgeNum">2</span>ラッキースポット・ラッキーカラー</div><div id="lucky"></div></div>
<div class="section marriage"><div class="sectionTitle"><span class="badgeNum">3</span>結婚したらどんな人？</div><div class="result" id="marriageResult"></div></div>
<div class="footer">✿　m i c h i b i k i　〜 自分らしい幸せへの道しるべ 〜<br><span>❀　✿　❀</span></div>
</section></main>
<script>
const data={
1:[`好きな人ができると恋心が言動に現れてわかりやすいでしょう。ナンバー1は純粋で情熱的。「好き」と思ったらわき目もふらずアプローチします。愛する人にはとにかく一途で、浮気や不倫の心配がないタイプです。\n\nただ、つねに主体的な恋愛をするので、脈ナシとわかれば諦めるのも早いはず。未練を残していつまでもズルズル……ということはまずありません。`,`高級ホテル`,`赤`],
2:[`誰かと一緒にいることで安心を覚えるところがあり、尽くし型の恋愛が多くなりがちに。好きな人の色に染まってでも気を惹きたくなるかもしれませんが、ナンバー2は価値観や感性が響き合う人でなければ物足りなさを覚えるタイプ。外見がドンピシャで好みな人より、マニアックな趣味の話をしても通じ合う人を恋人に選んだ方がいいでしょう。`,`和室`,`白`],
3:[`ナンバー3は、少女漫画や宝塚など“女子的”なものを好みやすく、自分の内面世界を大切にする傾向があります。決して恋愛下手ではないので、パートナー候補との接点は積極的に求めた方がいいでしょう。\n\n恋愛経験があまり多くないと頭でっかちになるかもしれませんが、相手を惹きつける魅力は十分あるので堂々と振る舞うことが大切です。好きな人の色に染まるとか、モテを意識してキャラを変えようとしないこと。束縛なく上下関係も作らず、対等に向き合える人が合うでしょう。`,`テーマパーク`,`黄色`],
4:[`内側からにじみ出る魅力を持つナンバー4ですが、周囲からは高嶺の花、取っつきにくいと思われるかもしれません。あざとさや媚びがないので、「魅力的だけれど相手にしてもらえない」と遠慮されることが少なくないのです。\n\nでも、だからといって無駄モテを狙う必要はなく、妥協もしなくて大丈夫。時間がかかっても自分にふさわしい人をちゃんと見つけられます。精神年齢が高く、つねに対等な関係が築ける人とめぐり会うでしょう。\n\nしっかり者のナンバー4と付き合える人はそう多くないので、フリーになるとパートナーがいない状態が続くのもある意味仕方ないこと。自分磨きを続けて、前向きに待つスタンスを大切にしましょう。`,`図書館`,`緑`],
5:[`サッパリとした恋愛観を持ち、恋人とはつかず離れずの距離感で付き合うでしょう。恋愛だけにのめり込むことがないので、彼氏にするなら仕事好きで束縛しないタイプがベスト。いつも忙しいハイスペ男性か、従順な年下男性が良さそうです。\n\nナンバー5は自分軸がしっかりしている反面、自己中心的になりやすいため、それを寛容に受け止められる人と付き合うことが大事です。精神年齢の高い大人か、あるいは振り回されることも楽しめるタイプがうまくいくでしょう。`,`海`,`青`],
6:[`好きな人の色に染まりやすい尽くしタイプです。積極的にアプローチするのが得意ではないものの、優しく人当たりが良いので自分が思う以上に恋上手。焦らず、友情の延長上でじっくり距離を縮めるとうまくいくでしょう。\n\nナンバー6は自分がどう思われているのか気にしすぎる傾向がありますが、それより相手を喜ばせたい気持ちを大切に。デートでは相手が笑顔になることを考えて、純粋にふたりの時間を楽しむと充実するはずです。\n\nとはいえ恋愛では受け身になりやすいため、都合の良い関係に甘んじてしまう可能性も。自分が幸せになることを最優先して、相手の言いなりにならないようにしましょう。`,`美術館`,`ピンク`],
7:[`普段は淡々としているように見えても、実は恋愛体質のナンバー7。好きな人がいないと毎日が退屈に感じるかもしれません。また、恋人との関係がうまくいっているかどうかで毎日の充実度は変わってくるでしょう。ロマンチストなので、恋に落ちると些細なことでも一喜一憂しやすく、想いが報われず苦しい状態が続けばテンションが落ちてしまうはず。仕事や交友関係に影響が出ることも少なくありません。\n\nそのため、ナンバー7は恋人選びが何より大事です。ネガティブタイプと付き合えば不幸街道まっしぐら。悪い影響を受けていると気づけない場合もあるので、恋愛に依存しすぎないようにしましょう。毎日が楽しく幸せだと思えるかどうかが良い恋をしている判断基準になります。`,`プラネタリウム`,`紺色`],
8:[`長所は伸ばし合い、欠点は補い合うような建設的な関係を好みます。少し頭でっかちなところはありますが、現実的で落ち着いた恋愛をするでしょう。\n\n尊敬の念をきっかけに人を好きになることが多く、衝動的に誰かにのめり込むことは稀です。明らかに自分よりも格上の人や、信頼できる仕事仲間をいつの間にか好きになっていた……というパターンが多いはず。外見だけに惚れたり、一度に複数の人を好きになったりすることは珍しいでしょう。\n\n恋人とはお互いを尊重した大人の関係を望みます。ナンバー8に公私混同はなく、恋愛に依存することもありません。恋人には甘い会話だけでなく、堅めのビジネストークも楽しめるタイプを求めます。ナンバー8と公私ともにパートナーになれば最強のコンビになるかもしれません。`,`パーティー会場`,`オレンジ`],
9:[`ナンバー9は愛情深く、優しい人として相手に好印象を与えます。フレンドリーで欲がなく、そもそも付き合いやすいタイプなので恋のチャンスは決して少なくありません。\n\nただ、誰に対しても公平に親切なため、恋人から嫉妬されたり、好きでもない人に「俺のこと好きなんでしょ？」と勘違いされたりする可能性も。本命とそれ以外の人は、意識して態度を変えた方がいいかもしれません。\n\n一方でナンバー9は束縛が苦手で、恋人であっても言動を制限されるとうんざりしてしまいます。気を遣わずに長続きするのは、精神年齢が高く心のつながりを重視できるタイプ。LINEの頻度や誰と話したかなど、小さなことで騒ぎ立てない大人の相手が合うでしょう。`,`博物館`,`紫`],
11:[`話すほど魅力がにじみ出るタイプなので、ナンバー11と付き合う相手は心底惚れ込み離れがたく感じます。ほかの人とは少し違うあなたの視点が面白く、恋人はつねに新しい発見を得るでしょう。ありのままの自分をさらけ出すほど愛されるはずです。\n\nただ、ナンバー11はセンシティブで心配性の面が出るとウジウジしがちに。自分にも相手にも理想が高くなりがちなので、「こうなりたい。こうしなくちゃいけない」と思いすぎないように。先を見すぎて目の前にある幸せを見落とさないことが大切です。\n\nそして、努力を怠らなければ、ナンバー11はステータスのある人と付き合うことも可能なタイプ。理想を具体的な現実に落とし込めたらワンランク上の幸せを手に入れられます。`,`神社`,`シルバー`],
22:[`ナンバー22と対等に付き合える男性はそう多くありません。自立心が旺盛なしっかり者で隙がなく、たいていの男性は「自分では釣り合いが取れない」と怯んでしまうでしょう。\n\nただ、ナンバー22は周囲が思う以上に繊細で、思考が深く迷うことも多いタイプ。そこまで汲んで包み込んでくれる人こそ最高の恋人になります。年上の人や、人生経験が豊富で精神年齢が高い人が合うでしょう。ハイスペックな人とは公私ともに協力し合える良きパートナーになるはずです。\n\n恋に恋するタイプではないので、恋人とは落ち着いた大人の関係を築きます。仕事や堅めの話題も気楽に話せる人とは結婚に進みやすいでしょう。`,`海外`,`ゴールド`],
33:[`ふんわりした柔和な雰囲気を持つナンバー33は、相手の守ってあげたい気持ちをくすぐります。実年齢にくらべて若く見えたり、年齢を重ねてもかわいい印象があったりして恋のチャンスは多め。癒し系として恋愛対象に見られやすいタイプです。\n\n恋のスタイルは基本的に尽くし型ですが、「私の考えを理解してもらえなかったらどうしよう」と心配しがち。情熱的に甘えたかと思うと急に素っ気なくなる……という謎行動をつい取ってしまいます。起きてもいないことを考えて杞憂してしまうときは、目の前の現実だけに集中するように。ネガティブな考えはだいぶ減るはずです。\n\nまた、何もしなくても魅力たっぷりのナンバー33は、駆け引きや姑息なテクニックは要りません。ありのまま振る舞うことで幸せをちゃんと手に入れられます。`,`自然`,`レインボー`]
};
const marriageData={
"貫索星":["自分の信念をしっかり持ち、独自の道を歩む人","このような人は、相手に安心感や信頼感を与え、夫婦関係の強い支えとなります。"],
"石門星":["公平で平等を大切にする人","このような人は、家族を大切にし、相手の気持ちを尊重して関係を円滑にします。"],
"鳳閣星":["小さなことに拘らない大らかな人","このような人は心が広く、相手をそのまま受け入れられることを大切にし、お互いを尊重する関係を目指します。"],
"調舒星":["感性豊かなアーティストのような人","このような人は日常での美しさや感動を見つけ、夫婦としても相手に尽くすことを大切にします。"],
"禄存星":["他人の欠点も受け入れられる愛情深く頼れる人","このような人は家族を大切にし、その存在だけで安心感を与えてくれます。"],
"司禄星":["家庭を大切にする真面目な人","このような人は家族の幸せを最優先し、日常から大事な決断までしっかり考えるので、家庭での頼りになる存在です。"],
"車騎星":["責任感が強く、家庭でのリーダーとなる働き者","このような人は家族の安定した生活を支える頼れる存在となります。"],
"牽牛星":["社会的にも評価される家柄や容姿の持ち主","このような人は、その背景や外見により注目され、結婚後も特別な体験や価値観を持って生活します。"],
"龍高星":["新しい経験を求め、自由を大切にする人","このような人は常に変化を追求するため、結婚しても、一緒にいる時間が刺激的で楽しいものとなります。"],
"玉堂星":["心の温かさと知性を兼ね備えたおだやかな人","このような人は人の心に寄り添う優しさを持っています。その温かみと知的な面が融合した魅力で、家族をしっかりと支えます。"]
};
const starSelect=document.getElementById('star');Object.keys(marriageData).forEach(s=>starSelect.add(new Option(s,s)));
function getDestinyNumber(v){if(!v)return null;const a=v.replace(/\D/g,'');if(a.length!==8)return null;let n=[...a].reduce((x,c)=>x+Number(c),0);while(n>9&&![11,22,33].includes(n))n=[...String(n)].reduce((x,c)=>x+Number(c),0);return n;}
const birth=document.getElementById('birth'),numDisplay=document.getElementById('numDisplay');birth.addEventListener('change',()=>{const n=getDestinyNumber(birth.value);numDisplay.value=n?`運命数 ${n}`:'生年月日を入力してください';});

function makeReport(){const n=getDestinyNumber(birth.value);if(!n||!data[n]){alert('生年月日を入力してください。');return;}const s=starSelect.value;if(!s){alert('第一命星を選択してください。');return;}document.getElementById('reportName').textContent=document.getElementById('name').value||'あなた';document.getElementById('reportNum').textContent=`運命数 ${n}`;document.getElementById('mascot').src=mascotImages[n]||mascotImages[1];document.getElementById('love').textContent=data[n][0];document.getElementById('lucky').innerHTML=`<span class="spot">スポット：${data[n][1]}</span><span class="spot">カラー：${data[n][2]}</span>`;const m=marriageData[s];document.getElementById('marriageResult').textContent=`第一命星：${s}\n${m[0]}。${m[1]}`;document.getElementById('report').classList.add('show');document.getElementById('report').scrollIntoView({behavior:'smooth'});}
async function savePNG(){const r=document.getElementById('report');if(!r.classList.contains('show')){alert('先に鑑定書を作成してください。');return;}if(!window.html2canvas){const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(sc);await new Promise((ok,no)=>{sc.onload=ok;sc.onerror=no;});}r.classList.add('export-mode');const mascot=document.getElementById('mascot');if(mascot.decode){try{await mascot.decode()}catch(e){}}await new Promise(ok=>requestAnimationFrame(()=>requestAnimationFrame(ok)));const canvas=await html2canvas(r,{scale:1.35,backgroundColor:'#fffaf4',useCORS:true,width:1000,windowWidth:1100});r.classList.remove('export-mode');const a=document.createElement('a');a.download='michibiki_恋愛結婚鑑定.png';a.href=canvas.toDataURL('image/png');a.click();}
